return'<h2>مشتریان و ارسال پیام</h2>'+hd+b}

const mtLoad=()=>{let o=null;try{o=JSON.parse(metaGet('metro')||'null')}catch(e){}return(Array.isArray(o)&&o.length?o:MT0).map(l=>({...l}))},
mtNames=s=>String(s||'').split(/[،,\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>({n:x.replace(/^~/,'').trim(),on:!x.startsWith('~')})),
mtSave=(n,k,v)=>{const L=mtLoad();L.forEach(l=>{if(l.n==n)l[k]=v});metaSet('metro',JSON.stringify(L));save();render()},

function mtRoute(a,b){const L=mtLoad(),adj={},by={},add=(x,y,w)=>{(adj[x]=adj[x]||[]).push([y,w]);(adj[y]=adj[y]||[]).push([x,w])};
L.forEach(l=>[l.st,l.br].forEach(s=>{const A=mtNames(s).filter(x=>x.on).map(x=>x.n);A.forEach(n=>(by[n]=by[n]||new Set()).add(l.n));for(let i=1;i<A.length;i++)add(A[i-1]+'|'+l.n,A[i]+'|'+l.n,2.5)}));
Object.entries(by).forEach(([n,s])=>{const ls=[...s];for(let i=0;i<ls.length;i++)for(let j=i+1;j<ls.length;j++)add(n+'|'+ls[i],n+'|'+ls[j],5)});
if(!by[a]||!by[b])return null;if(a==b)return{legs:[],min:0,tr:0,inc:[]};
const d={},pv={},done=new Set();[...by[a]].forEach(l=>d[a+'|'+l]=0);
for(;;){let u=null;for(const k in d)if(!done.has(k)&&(u==null||d[k]<d[u]))u=k;if(u==null)break;done.add(u);if(u.split('|')[0]==b){const P=[];for(let k=u;k!=null;k=pv[k])P.unshift(k.split('|'));const legs=[];P.forEach(([n,l])=>{const g=legs[legs.length-1];g&&g.line==l?(g.to=n,g.stops++):legs.push({line:+l,from:n,to:n,stops:0})});const real=legs.filter((g,i)=>g.stops>0||legs.length==1);const inc=[...new Set(real.map(g=>g.line))].filter(n=>!(L.find(l=>l.n==n)||{}).full);return{legs:real,min:Math.round(d[u]),tr:Math.max(0,real.length-1),inc}}
(adj[u]||[]).forEach(([v,w])=>{if(d[v]==null||d[u]+w<d[v]){d[v]=d[u]+w;pv[v]=u}})}return null}

ر تعویض ۵ دقیقه).</li><li>در ایستگاه تعویض، رنگ خط مقصد را روی تابلوها دنبال کنید.</li><li>ساعت کاری معمولاً از حدود ۵:۳۰ تا ۲۲ است و بسته به خط و روز تفاوت دارد؛ برای ساعت دقیق به سایت رسمی مراجعه کنید.</li><li>ایستگاه‌های در حال ساخت با علامت «غیرفعال» نشان داده می‌شوند و در مسیریابی لحاظ نمی‌شوند.</li></ul>`)+adm}

async function reversePlace(lat,lon){
  const clean=v=>String(v||'').trim();
  let city='شهر نامشخص',area='محله نامشخص',street='';
  // Nominatim first: better street/road detail for a single user-triggered lookup.
  try{
    const nu='https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lon)+'&zoom=18&addressdetails=1&accept-language=fa';
    const nr=await fetch(nu,{headers:{'Accept-Language':'fa'}});
    if(nr.ok){const nx=await nr.json(),a=nx.address||{};city=clean(a.city||a.town||a.municipality||a.county||a.village);area=clean(a.neighbourhood||a.suburb||a.quarter||a.city_district);street=clean(a.road||a.pedestrian||a.footway||a.residential);if(city||area||street)return{city:city||'شهر نامشخص',area:area||'محله نامشخص',street,lat,lon,source:'OpenStreetMap'}}
  }catch(e){}
  // BigDataCloud fallback: reliable city/suburb result directly from the device.
  const ctl=new AbortController(),tmr=setTimeout(()=>ctl.abort(),7000);
  try{
    const u='https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+encodeURIComponent(lat)+'&longitude='+encodeURIComponent(lon)+'&localityLanguage=fa';
    const r=await fetch(u,{signal:ctl.signal,mode:'cors'});if(!r.ok)throw new Error('BDC '+r.status);const x=await r.json();
    city=clean(x.city||x.locality||x.principalSubdivision);area=clean(x.locality&&x.locality!==city?x.locality:x.suburb);
    return{city:city||'شهر نامشخص',area:area||'محله نامشخص',street:'',lat,lon,source:'BigDataCloud'};
  }finally{clearTimeout(tmr)}
}
async function reversePlaceApprox(){const r=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=fa',{mode:'cors'});if(!r.ok)throw new Error('تشخیص موقعیت تقریبی ناموفق بود');const x=await r.json();return{city:String(x.city||x.locality||x.principalSubdivision||'شهر نامشخص'),area:String(x.suburb||x.locality||'محله نامشخص'),street:'',source:'IP تقریبی'}}

function pianoNote(ctx,dest,midi,when,dur,vol){const f=440*Math.pow(2,(midi-69)/12),o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o1.type='triangle';o2.type='sine';o1.frequency.value=f;o2.frequency.value=f*2;lp.type='lowpass';lp.frequency.value=2400;g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vol,when+.015);g.gain.exponentialRampToValueAtTime(Math.max(.0001,vol*.35),when+dur*.35);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o1.connect(lp);o2.connect(g);lp.connect(g);g.connect(dest);o1.start(when);o2.start(when);o1.stop(when+dur+.03);o2.stop(when+dur+.03);music.sources.push(o1,o2)}

async function accountBalanceAdjust115(id){
 const a=q('select * from accounts where id=?',[id])[0]; if(!a)return;
 const st=accountTxStats(id);
 const raw=prompt('ماندهٔ جدید حساب را وارد کنید. برای صفر کردن، عدد 0 را بنویسید.', String(Math.round(st.balance)) );

 const target=num(String(raw).replace(/,/g,''));
 if(!Number.isFinite(target))return alert('ماندهٔ جدید نامعتبر است.');
 const delta=target-st.balance;
 if(Math.abs(delta)<0.000001)return alert('ماندهٔ حساب همین مقدار است و نیازی به اصلاح ندارد.');
 const direction=delta>0?'دریافت اصلاحی':'پرداخت اصلاحی';
 const msg='ماندهٔ فعلی: '+nf(st.balance)+' تومان\nماندهٔ جدید: '+nf(target)+' تومان\nمبلغ اصلاح: '+nf(Math.abs(delta))+' تومان\nنوع: '+direction+'\n\nسوابق قبلی تغییر نمی‌کنند؛ فقط یک ردیف اصلاحی جدید ثبت می‌شود. ادامه؟';
 if(!confirm(msg))return;
 try{
   await accountSafetyCheckpoint('اصلاح ماندهٔ حساب '+a.name);
   run('insert into tx(date,amount,type,cat,acc,note,ex,adj) values(?,?,?,?,?,?,0,1)',[today(),Math.abs(delta),delta>0?'in':'out',null,id,'اصلاح مانده حساب از '+nf(st.balance)+' به '+nf(target)+' تومان — بدون تغییر سوابق قبلی']);
   save();
   $('#md').innerHTML='';
   S.msg='ماندهٔ حساب بدون تغییر سوابق قبلی اصلاح شد';
   render();
 }catch(e){alert('اصلاح مانده انجام نشد: '+e.message)}
}

function storeAvailable117(p){return !!p&&(p.type==='ebook'||p.type==='audio'||p.type==='course'||p.type==='service'||(+p.stock||0)>0)}
function storeDiscount117(total,c){const code=String(S.coupon||'').trim().toUpperCase();if(!code||!c.coupon||code!==String(c.coupon).trim().toUpperCase())return 0;const v=+c.couponValue||0;return c.couponType==='fixed'?Math.min(total,v):Math.min(total,Math.round(total*v/100))}
function storeCartTotal117(){const P=storeProducts117(),ids=storeCart117();let sub=0;ids.forEach(x=>{const p=storeProduct117(x.id);if(p)sub+=(+p.price||0)*(+x.qty||1)});const c=storeCfg117(),disc=storeDiscount117(sub,c),ship=sub-disc>0?(+c.shipping||0):0;return {sub,disc,ship,total:Math.max(0,sub-disc+ship)}}
function storeAdd117(id){const p=storeProduct117(id);if(!p||!storeAvailable117(p))return alert('این محصول فعلاً قابل سفارش نیست');const a=storeCart117(),x=a.find(i=>String(i.id)===String(id));if(x)x.qty=Math.min((+x.qty||1)+1,Math.max(1,+p.stock||999));else a.push({id:p.id,qty:1});saveStoreCart117(a);render()}

function storePlaceOrder117(){const a=storeCart117(),P=storeProducts117(),c=storeCfg117(),items=a.map(x=>{const p=P.find(z=>String(z.id)===String(x.id));return p?{id:p.id,title:p.title,price:+p.price||0,qty:+x.qty||1,type:p.type}:null}).filter(Boolean);if(!items.length)return alert('سبد خرید خالی است');const t=storeCartTotal117();const name=prompt('نام خریدار',firstName117())||'';if(!name.trim())return;const phone=prompt('شماره موبایل',String((authGet()||{}).phone||''))||'';const no='ORD-'+Date.now();const orders=storeOrders117();orders.unshift({no,items,total:t.total,sub:t.sub,discount:t.disc,shipping:t.ship,name:name.trim(),phone:phone.trim(),status:'در انتظار پرداخت',pay:'card',ts:Date.now()});saveStoreOrders117(orders);saveStoreCart117([]);S.storeCheckout=false;render();alert('سفارش '+no+' ثبت شد.\n\nروش پرداخت: کارت‌به‌کارت\n'+(c.card?'شماره کارت: '+c.card:'شماره کارت فروشنده هنوز ثبت نشده')+'\n'+(c.holder?'به نام: '+c.holder:'')+'\n'+(c.bank?'بانک: '+c.bank:'')+'\n\nپس از پرداخت، کد پیگیری را برای پشتیبانی ارسال کنید.')}

async function storeLoadXlsx117(){
 if(window.XLSX)return true;
 const urls=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];

}
function storeNormHead117(v){return String(v??'').trim().toLocaleLowerCase('fa-IR').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\s_\-\/()]+/g,'').replace(/‌/g,'')}
function storeType117(v){const x=String(v??'').trim().toLocaleLowerCase('fa-IR');if(/دوره|course/.test(x))return'course';if(/کتاب.*صوت|صوت|audio/.test(x))return'audio';if(/کتاب|ebook|الکترون/.test(x))return'ebook';if(/خدمت|service/.test(x))return'service';return'goods'}
function storeHeaderMap117(row){
 const H={};row.forEach((v,i)=>{const k=storeNormHead117(v);if(k)H[k]=i});
 const find=arr=>{for(const a of arr){const k=storeNormHead117(a);if(H[k]!=null)return H[k]}return-1};
 return {title:find(['عنوان محصول','نام محصول','عنوان','محصول','title','product','name']),cat:find(['دسته بندی','دسته','category','cat']),price:find(['قیمت','قیمت تومان','price']),type:find(['نوع','نوع محصول','type']),stock:find(['موجودی','stock','inventory']),sku:find(['کد کالا','کد','sku','کد محصول']),brand:find(['برند','مدرس','ناشر','brand']),image:find(['تصویر','آدرس تصویر','image','imageurl']),url:find(['لینک','لینک تحویل','url','link']),desc:find(['توضیحات','توضیح','description','desc'])};
}
function storeSafeUrl117(v){const x=String(v??'').trim();return/^https?:\/\//i.test(x)?x:''}
function storeParseRow117(r,m,idx){
 const g=(k,d='')=>m[k]>=0?String(r[m[k]]??'').trim():d;
 const title=g('title',idx===0?'':''); if(!title)return null;
 const rawPrice=g('price','').replace(/[,٬\s]/g,''); const price=Math.max(0,num(rawPrice)||0);
 const stock=Math.max(0,Math.floor(num(g('stock','0'))||0));
 const type=storeType117(g('type','کالا')); const cat=g('cat',storeTypeName117(type));
 return {id:Date.now()+idx,title,cat:cat||storeTypeName117(type),price,type,stock,sku:g('sku',''),brand:g('brand',''),image:storeSafeUrl117(g('image','')),url:storeSafeUrl117(g('url','')),desc:g('desc',''),rating:5,episodes:[]};
}
async function storeImportExcel117(file){if(!canEdit())return;if(!file)return;try{if(file.size>15*1024*1024)throw new Error('فایل Excel بزرگ‌تر از ۱۵ مگابایت قابل ورود نیست');
  let rows=[];
  if(/\.csv$|text\/csv/i.test(file.name+' '+file.type)){const text=await file.text();rows=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()).map(line=>line.split(',').map(v=>v.replace(/^"|"$/g,'')))}
  else{const ok=await storeLoadXlsx117();if(!ok)throw new Error('کتابخانه Excel بارگذاری نشد؛ اینترنت یا VPN را بررسی کنید');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false,raw:true});const name=wb.SheetNames[0];if(!name)throw new Error('هیچ Sheetای در فایل پیدا نشد');rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:true})}
  if(rows.length<2)throw new Error('فایل حداقل یک ردیف عنوان و یک ردیف محصول لازم دارد');
  const m=storeHeaderMap117(rows[0]);
  if(m.title<0){m.title=0;m.cat=m.cat<0?1:m.cat;m.price=m.price<0?2:m.price;m.type=m.type<0?3:m.type;m.stock=m.stock<0?4:m.stock;m.sku=m.sku<0?5:m.sku;m.brand=m.brand<0?6:m.brand;m.image=m.image<0?7:m.image;m.url=m.url<0?8:m.url;m.desc=m.desc<0?9:m.desc}
  const out=[],bad=[];rows.slice(1).forEach((r,i)=>{const p=storeParseRow117(r,m,i+1);if(p)out.push(p);else bad.push(i+2)});
  if(!out.length)throw new Error('هیچ محصول معتبری از فایل استخراج نشد');
  const old=storeProducts117();const msg=`${fd(out.length)} محصول شناسایی شد${bad.length?' و '+fd(bad.length)+' ردیف خالی/نامعتبر بود':''}.\n\nبه محصولات فعلی اضافه شود؟`;
  if(!confirm(msg))return;await accountSafetyCheckpoint('ورود محصولات فروشگاه از Excel '+file.name);saveStoreProducts117(out.concat(old));alert('ورود محصولات با موفقیت انجام شد: '+fd(out.length)+' محصول جدید');render();
 }catch(e){alert('ورود Excel انجام نشد: '+e.message)}
}
