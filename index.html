const iso=g=>g[0]+'-'+pad(g[1])+'-'+pad(g[2]),today=()=>{const d=new Date();return iso([d.getFullYear(),d.getMonth()+1,d.getDate()])};
const toJ=s=>g2j(...s.split('-').map(Number)),fj=s=>s?fd(toJ(s).map((v,i)=>i?pad(v):v).join('/')):'';

const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

let db,SQL;const SCHEMA=`create table if not exists meta(k text primary key,v text);create table if not exists accounts(id integer primary key,name text,opening real default 0);create table if not exists categories(id integer primary key,name text);
create table if not exists tx(id integer primary key,date text,amount real,type text,cat integer,acc integer,note text);create table if not exists checks(id integer primary key,kind text,no text,amount real,due text,party text,status text);

create table if not exists assets(id integer primary key,kind text,sym text,price real default 0);create table if not exists trades(id integer primary key,asset integer,side text,qty real,price real,fee real default 0,date text,src text,note text);create table if not exists users(id integer primary key,email text unique,salt text,hash text,mode text default 'tx',quota integer default 100,used integer default 0,start text,end text,active integer default 1,note text);`;
const init=()=>{db.run(SCHEMA);['alter table tx add column ex integer default 0','alter table categories add column parent integer default 0','alter table categories add column kind integer','alter table categories add column hx text','alter table accounts add column hx text','alter table tx add column hx text','alter table checks add column hx text','alter table loans add column hx text','alter table loan_payments add column hx text','alter table loan_payments add column txid integer'].forEach(x=>{try{db.run(x)}catch(e){}});fixCats();fixKinds()};

const idb=(m,v,k)=>new Promise((res,rej)=>{const o=indexedDB.open('acc',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onerror=rej;o.onsuccess=()=>{const t=o.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),r=m=='get'?t.get(k||'db'):t.put(v,k||'db');r.onsuccess=()=>res(r.result);r.onerror=rej}});
let tm,st,sc;function flush(){if(S.archiveMode)return;if(st){clearTimeout(st);st=0;idb('put',db.export()).catch(()=>{})}}

/* ---------- Google Drive (appDataFolder) ---------- */
const D={tok:null,exp:0,cid:localStorage.cid||'',auto:localStorage.auto=='1'};
D.auth=()=>new Promise((res,rej)=>{if(D.tok&&Date.now()<D.exp)return res(D.tok);if(!D.cid)return rej(new Error('شناسه کلاینت گوگل را وارد کنید'));if(!/^[\w-]+\.apps\.googleusercontent\.com$/.test(D.cid))return rej(new Error('Client ID معتبر نیست؛ باید مثل 123-abc.apps.googleusercontent.com باشد'));if(!/^https?:$/.test(location.protocol))return rej(new Error('ورود گوگل فقط روی آدرس https کار می‌کند، نه فایل محلی'));
const go=()=>google.accounts.oauth2.initTokenClient({client_id:D.cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error(r.error));D.tok=r.access_token;D.exp=Date.now()+(r.expires_in-60)*1e3;res(D.tok)}}).requestAccessToken({prompt:D.tok?'':'consent'});
if(window.google&&google.accounts)go();else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=()=>rej(new Error('بارگذاری سرویس گوگل ناموفق بود'));document.head.appendChild(s)}});
D.f=async(u,o={})=>{const t=await D.auth(),r=await fetch(u,{...o,headers:{Authorization:'Bearer '+t,...o.headers}});if(!r.ok)throw new Error('Drive '+r.status);return r};
D.find=async()=>(await(await D.f('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='accounting.sqlite'"))).json()).files[0];

async function createYearArchive(y){y=+y;if(!y)return alert('سال را وارد کنید');if(y==toJ(today())[0])return alert('سال جاری قابل بایگانی نیست؛ برای جلوگیری از حذف اطلاعات سال جاری، ابتدا سال بعد را شروع کنید.');const tx=q('select * from tx').filter(r=>yearOf(r.date)==y),cks=q('select * from checks').filter(r=>yearOf(r.due)==y),lp=q('select * from loan_payments').filter(r=>yearOf(r.due)==y),loans=q('select * from loans').filter(l=>lp.some(p=>p.loan==l.id)),tr=q('select * from trades').filter(r=>yearOf(r.date)==y),assetIds=[...new Set(tr.map(r=>r.asset))],assets=q('select * from assets').filter(a=>assetIds.includes(a.id)),catIds=[...new Set(tx.map(r=>r.cat).filter(Boolean))],accIds=[...new Set(tx.map(r=>r.acc).filter(Boolean))],cats=q('select * from categories').filter(c=>catIds.includes(c.id)),accs=q('select * from accounts').filter(a=>accIds.includes(a.id));if(!tx.length&&!cks.length&&!lp.length&&!tr.length)return alert('برای این سال داده‌ای برای بایگانی پیدا نشد');const ar=new SQL.Database();const keep=db;db=ar;init();const ins=(t,o)=>{const ks=Object.keys(o);runRaw('insert into '+t+'('+ks.join(',')+') values('+ks.map(()=>'?').join(',')+')',ks.map(k=>o[k]))};[['accounts',accs],['categories',cats],['tx',tx],['checks',cks],['loans',loans],['loan_payments',lp],['assets',assets],['trades',tr]].forEach(([t,rows])=>rows.forEach(o=>ins(t,o)));const bytes=ar.export();db=keep;try{ar.close()}catch(e){}await idb('put',bytes,'archive_'+y);const arr=archList().filter(a=>a.year!=y);arr.push({year:y,created:new Date().toISOString(),size:bytes.length});archSave(arr);if(confirm('آرشیو ساخته شد. آیا اطلاعات این سال از برنامهٔ جاری هم خارج شود؟')){db.run('begin');try{accs.forEach(a=>{const d=tx.filter(t=>t.acc==a.id).reduce((z,t)=>z+(t.type=='in'?+t.amount:-+t.amount),0);if(d)run('update accounts set opening=opening+? where id=?',[d,a.id])});tx.forEach(r=>run('delete from tx where id=?',[r.id]));cks.forEach(r=>run('delete from checks where id=?',[r.id]));lp.forEach(r=>run('delete fr async function runExport(k,src){try{const tb=tplMeta(k)&&await idb('get',null,'tpl_'+k);if(!tb)throw new Error('ابتدا فایل قالب '+TPL[k][0]+' را یک‌بار انتخاب کنید');const f={arrayBuffer:async()=>tb},ex=k=='hdb'?expHdb:expPar;
if(!src||src.type=='live')await ex(f);else if(src.type=='sqlite')await withTemp(new Uint8Array(await src.file.arrayBuffer()),()=>ex(f));else await withTemp(null,async()=>{const r=importRows(src.rows,src.opt);if(!r.n)throw new Error('هیچ ردیف معتبری برای تبدیل نبود');await ex(f)})}catch(e){S[k=='hdb'?'hmsg':'pmsg']='خطا: '+e.message;render()}}
const expv=()=>`<div style="max-width:420px;margin:8vh auto 0"><div class="cd"><h3>مدت استفادهٔ این نسخه تمام شده است</h3><p class="mu">برای ادامه، کد فعال‌سازی جدید را از ${esc(brand()||'تولیدکننده')} بگیرید و وارد کنید.</p><button class="pr" style="width:100%" onclick="askLicense()">وارد کردن کد فعال‌سازی</button></div><div class="mu" style="text-align:center">${esc(brand())}</div></div>`;
async function lockDrive(){try{const c=val('#lCid').trim()||D.cid;if(!c)throw new Error('Client ID را وارد کنید');D.cid=c;try{localStorage.cid=c}catch(e){}D.tok=null;S.lmsg='در حال اتصال به Drive…';render();await D.down();if(!authGet())throw new Error('در Drive اطلاعات ورود پیدا نشد؛ ابتدا در گوشی یک‌بار «همگام‌سازی» را بزنید');try{const a=metaGet('about');if(a)localStorage.about=a}catch(e){}S.lm='login';S.lmsg='بازیابی شد؛ با همان ایمیل و رمز گوشی وارد شوید';render()}catch(e){S.lm='setup';S.lmsg='خطا: '+e.message;render()}}
async function lockRestore(f){if(!f)return;try{const sq=sqliteRead(await f.arrayBuffer());if(!(sq.has('tx')&&sq.has('loan_payments')))throw new Error('این فایل پشتیبان همین برنامه نیست');const a=sq.has('meta')?sq.get('meta').find(r=>r.k=='auth'):null;if(!a)throw new Error('این پشتیبان اطلاعات ورود ندارد؛ با نسخهٔ جدید برنامه دوباره پشتیبان بگیرید، یا اینجا یک حساب تازه بسازید و بعد از ورود، پشتیبان را بازیابی کنید');
S.noConfirm=1;try{await imp(f)}finally{S.noConfirm=0}if(!authGet())throw new Error('بازیابی انجام نشد');S.lm='login';S.lmsg='پشتیبان بازیابی شد؛ با همان ایمیل و رمز قبلی وارد شوید';render()}catch(e){S.lmsg='خطا: '+e.message;render()}}
/* ---------- Boot ---------- */
const ld=u=>new Promise((y,n)=>{const e=document.createElement('script');e.src=u;e.onload=y;e.onerror=()=>n(new Error('load '+u));document.head.appendChild(e)});
async function engine(asm){const B=['https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/','https://unpkg.com/sql.js@1.8.0/dist/'];for(const w of asm?[0]:[1,0])for(const b of B){try{const js=b+(w?'sql-wasm.js':'sql-asm.js');await ld(js);return await initSqlJs(w?{locateFile:f=>b+f}:undefined)}catch(e){}}throw new Error('بارگذاری موتور SQLite ممکن نشد؛ دسترسی به CDNهای SQLite را بررسی کنید')}
async function boot(){$('#app').innerHTML='<div class="cd mu">در حال بارگذاری…</div>';try{SQL=await engine();let b=null;try{b=await idb('get')}catch(e){}
try{db=b?new SQL.Database(b):new SQL.Database()}catch(e){try{SQL=await engine(1);db=b?new SQL.Database(b):new SQL.Database()}catch(e2){b=null;db=new SQL.Database()}}init();
if(!b){run("insert into accounts(name) values('نقد')");['خوراک','حمل‌ونقل','مسکن','سایر','حقوق','سایر درآمدها'].forEach((n,i)=>run('insert into categories(name,kind) values(?,?)',[n,i>3?1:0]));save()}
try{S.th=localStorage.th||'auto';S.shk=localStorage.shk||'mid'}catch(e){S.th='auto';S.shk='mid'}addEventListener('devicemotion',onShake);try{if(localStorage.lic)S.lic=await readLicense(localStorage.lic)}catch(e){}try{const la=localStorage.auth;if(la&&!metaGet('auth')){metaSet('auth',la);save()}const lb=localStorage.about;if(lb&&!metaGet('about'))metaSet('about',lb)}catch(e){}applyTheme();try{const hh=location.hash.replace('#','');if(hh&&['menu','home','tx','ab','ck','ln','pf','rp','st','users','notes','rem','study','weather','calendar','archive'].includes(hh))S.tab=hh}catch(e){}const restored=restoreSession();if(!restored){S.locked=true;S.lm=authGet()?'login':'setup'}try{history.replaceState({accApp:1,tab:S.tab},'',location.href.split('#')[0]+'#'+S.tab);history.pushState({accApp:1,tab:S.tab},'',location.href.split('#')[0]+'#'+S.tab)}catch(e){}render();if(!restored&&authGet()&&bioOn())bioLogin();{const bc=botCfg();if(bc.on&&bc.token&&feat('bots'))S.botT=setInterval(botPoll,6000)}notify();schedule();setInterval(notify,18e5);if(!CAP&&D.auto&&D.cid)D.sync().then(render).catch(()=>{})}
catch(e){$('#app').innerHTML='<div class="cd"><b>اجرای برنامه ممکن نشد</b><p class="mu">'+esc(e.message)+'<br>اینترنت را بررسی کنید؛ بارگذاری اولیهٔ موتور SQLite لازم است.</p><button class="pr" onclick="boot()">تلاش دوباره</button></div>'}}
addEventListener('error',e=>{if(e.message==='Script error.'||e.message==='Script error')return;const a=$('#app');a&&a.insertAdjacentHTML('afterbegin','<div class="cd out">خطا: '+esc(e.message||'خطای نامشخص')+'</div>')});
addEventListener('popstate',e=>{if(S.archiveMode){closeYearArchive();return}if($('#md').innerHTML){$('#md').innerHTML='';return}const t=e.state&&e.state.accApp?e.state.tab:'menu';S.tab=t||'menu';touchSession();render()});['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>touchSession(),{passive:true}));addEventListener('pagehide',()=>{try{flush()}catch(e){}});document.addEventListener('visibilitychange',()=>{if(document.hidden)try{flush()}catch(e){}});
boot();
