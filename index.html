function accountTxStats(id){
 const r=q("select count(*) n,coalesce(sum(case when ex=0 and type='in' then amount else 0 end),0) ins,coalesce(sum(case when ex=0 and type='out' then amount else 0 end),0) outs from tx where acc=?",[id])[0]||{};

 return {count:+r.n||0,ins,outs,balance:opening+ins-outs,opening};
}
