name: Refresh Iran car prices
on:
  workflow_dispatch:
  schedule:
    # 02:30 and 14:30 Iran time (UTC+03:30)
    - cron: '0 23,11 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_car_prices.py
      - name: Commit refreshed prices
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/car-prices.json
          git diff --cached --quiet || (git commit -m 'Update verified car prices' && git push)
